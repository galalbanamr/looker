version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: competition
      POSTGRES_PASSWORD: competition123
      POSTGRES_DB: competition_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U competition -d competition_monitor" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cm-network

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: cm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cm-network

  # NestJS API
  api:
    build:
      context: ..
      dockerfile: hosting/Dockerfile.api
    container_name: cm-api
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - DATABASE_URL=postgresql://competition:competition123@postgres:5432/competition_monitor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/whatsapp-sessions
    networks:
      - cm-network

  # Next.js Frontend
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile.web
    container_name: cm-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:4100
    depends_on:
      - api
    networks:
      - cm-network

  # Nginx Reverse Proxy (optional - for SSL and single port)
  nginx:
    image: nginx:alpine
    container_name: cm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - cm-network

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:


networks:
  cm-network:
    driver: bridge
